# Workspace root. Not a package itself: it only ties the members together,
# holds the shared tool settings and the dev tools. One lock file: uv.lock.
[project]
name = "ai-support-hub"
version = "0.0.0"
description = "Enterprise AI Support Hub for Tallybridge (fictional payments company)"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["support-hub-api", "support-tools", "hub-evals"]

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "import-linter==2.16",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "testcontainers==4.15.0",
    # Stubs for mypy strict. Held at 20261103: the two newer releases are under a week old.
    "types-pyyaml==6.0.12.20261113",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/mcp_server", "evals"]

[tool.uv.sources]
support-hub-api = { workspace = true }
support-tools = { workspace = true }
hub-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# docs/ is the specification; its code blocks are illustrations, not code to lint.
extend-exclude = ["apps/web", "evals/runs", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "ANN", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["hub", "support_tools", "hub_evals"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run local subprocesses (make) on purpose.
"**/tests/**" = ["S101", "S603", "S607"]

# Module rules from docs/design.md §8. Each contract has an id: the unit tests check that every
# rule of the document has its contract and plant a wrong import to prove each one fails.
[tool.importlinter]
root_packages = ["hub", "support_tools", "hub_evals"]
# Needed so a contract can name `litellm`. External packages are not analysed, only imports of them.
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-imports-nothing"
name = "hub.domain imports nothing from the project"
type = "forbidden"
source_modules = ["hub.domain"]
# hub.* also matches hub.domain itself; import-linter allows a package to import its own modules.
forbidden_modules = ["hub.*", "support_tools", "hub_evals"]

[[tool.importlinter.contracts]]
id = "services-not-api-graph"
name = "service modules (design §8) do not import api or graph"
type = "forbidden"
source_modules = [
    "hub.guardrails",
    "hub.kb",
    "hub.llm",
    "hub.tools",
    "hub.memory",
    "hub.audit",
    "hub.privacy",
    "hub.metrics",
]
forbidden_modules = ["hub.api", "hub.graph"]

[[tool.importlinter.contracts]]
id = "api-mcp-independent"
name = "apps/api (hub) and apps/mcp_server (support_tools) do not import each other"
type = "independence"
modules = ["hub", "support_tools"]

[[tool.importlinter.contracts]]
id = "evals-mcp-independent"
name = "evals (hub_evals) and apps/mcp_server (support_tools) do not import each other"
type = "independence"
modules = ["hub_evals", "support_tools"]

# `protected`: only the allowed importer may import litellm directly; every module of the three
# root packages, new ones included, is checked. Reaching litellm through the gateway's own names
# (`from hub.llm.gateway import litellm`) is outside import-linter's reach; a unit test
# (test_litellm_is_not_reached_through_the_gateway_module) covers that.
[[tool.importlinter.contracts]]
id = "only-gateway-imports-litellm"
name = "only hub.llm.gateway imports litellm"
type = "protected"
protected_modules = ["litellm"]
allowed_importers = ["hub.llm.gateway"]

# Traces leave the process only through hub.observability.tracing, which applies the G9 filter
# (security §3) to everything it sends.
[[tool.importlinter.contracts]]
id = "only-tracing-imports-langfuse"
name = "only hub.observability.tracing imports langfuse"
type = "protected"
protected_modules = ["langfuse"]
allowed_importers = ["hub.observability.tracing"]

# A new tests folder must be added to mypy `files` and pytest `testpaths`.
[tool.mypy]
strict = true
python_version = "3.13"
# Lets mypy see pydantic-settings init arguments such as `_env_file` (pydantic docs, "mypy").
plugins = ["pydantic.mypy"]
# Several `tests` folders exist; explicit bases give each test file a unique module name.
mypy_path = "apps/api/src:apps/mcp_server/src:evals/src"
explicit_package_bases = true
files = [
    "apps/api/src",
    "apps/api/tests",
    "apps/mcp_server/src",
    "apps/mcp_server/tests",
    "evals/src",
    "evals/tests",
    "infra/alembic",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
# Explicit, so pytest-asyncio does not warn that it is unset.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests/unit", "apps/mcp_server/tests", "evals/tests"]
