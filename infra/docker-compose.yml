# Local stack (docs/operations.md §1). `make up` starts it, `make down` stops it.
# Service that comes later: `web` (Vite dev server, phase 10).
#
# hub:hub and hub_api:hub_api are local defaults only, never real credentials. Every port binds to 127.0.0.1, so
# nothing is reachable from the network. The image tags are also used by the testcontainers
# fixtures (apps/api/tests/integration/conftest.py reads them from this file).
name: support-hub

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-time init the entrypoint runs a temporary server on the Unix
      # socket only, which a socket check would wrongly report as ready.
      # $$ escapes compose interpolation, so the container's own POSTGRES_* values are used.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$${POSTGRES_USER}\" --dbname \"$${POSTGRES_DB}\""]
      # Every 2s while starting (so `up --wait` is quick), then every 30s (quiet logs).
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has bash but no curl or wget. /readyz needs no API key (Qdrant docs, "Monitoring").
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    # `.env` gives the settings; the URLs below point at the compose services instead of localhost.
    env_file:
      - path: ../.env
        required: false
    environment:
      # The app connects as hub_api (member of hub_app, no UPDATE/DELETE on audit_log); the
      # migrator connection is the schema owner hub (infra/postgres/init/02-app-user.sql).
      DATABASE_URL: postgresql+psycopg://hub_api:hub_api@postgres:5432/hub
      DATABASE_URL_DIRECT: postgresql+psycopg://hub:hub@postgres:5432/hub
      EVAL_DATABASE_URL: postgresql+psycopg://hub_api:hub_api@postgres:5432/hub_eval
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_URL: http://mcp:8001/mcp
      EMBEDDING_CACHE_DIR: /app/.cache/models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../apps/api/src:/app/apps/api/src:ro
      # The app loads the model config and the prompt files at start (P3-05).
      - ../config:/app/config:ro
      - ../prompts:/app/prompts:ro
      # LLM_MODE defaults to fake: the recorded answers must be where `FIXTURES_DIR`
      # (hub/llm/gateway.py) looks for them, or every model call fails (deferred from P3-01).
      # Dev image only; the production image (phase 10) runs real mode without them.
      - ../apps/api/tests/fixtures/llm:/app/apps/api/tests/fixtures/llm:ro
      # Local embedding model from `make models` (ADR-0018): the app never downloads it. The
      # production image (P10-06) downloads it at build time instead.
      - ../.cache/models:/app/.cache/models:ro
      # POST /admin/kb/reindex reloads the articles from here (P5-01).
      - ../data/kb:/app/data/kb:ro
      # The chat's customer picker (GET /demo/customers, P10-02).
      - ../data/seed/demo_customers.json:/app/data/seed/demo_customers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      # /health, not /ready: the api is healthy even while a dependency is down; /ready reports
      # the dependencies (postgres, qdrant, mcp).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  # Support-tools MCP server (P7-01): core mock over data/seed, Jira and Slack mocks. Streamable
  # HTTP at /mcp behind MCP_SERVER_TOKEN, which `make dev` requires in .env.
  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
    # The server reads only MCP_SERVER_TOKEN and CORE_ANCHOR_DATE from it (support_tools.server).
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../apps/mcp_server/src:/app/apps/mcp_server/src:ro
      - ../data/seed:/app/data/seed:ro
    healthcheck:
      # A plain GET without a token is answered 401 once the server listens; that is enough.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:8001/mcp', timeout=2)
          except urllib.error.HTTPError as e:
              raise SystemExit(e.code != 401)
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  qdrant-data:
