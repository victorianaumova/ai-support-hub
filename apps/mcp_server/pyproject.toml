[project]
name = "support-tools"
version = "0.0.0"
description = "MCP server with the support tools (core mock, Jira, Slack)"
requires-python = ">=3.13,<3.14"
license = "MIT"
# Must never depend on `hub`: the two apps talk only over MCP (design §8).
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.4",
    # A dependency of mcp (form parsing in its auth routes), pinned here only to hold it back:
    # 0.0.34 was two days old at P7-01 (releases at least a week old, design §9).
    "python-multipart==0.0.34",
    "starlette==1.10.0",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
