[project]
name = "support-hub-api"
version = "0.0.0"
description = "Support Hub API, workflow and guardrails"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    # Native code of argon2-cffi. Held at 26.1.0 (2026-08-20): 26.2.0 was published hours before
    # P2-05 and had no track record yet (design §9; P2-05 review).
    "argon2-cffi-bindings==26.2.0",
    "fastapi==0.162.7",
    # Local embeddings (dense bge-small-en-v1.5 and BM25 sparse), used only in hub.llm.local_embedding
    # and hub.kb.sparse (ADR-0018). 0.9.1: 2026-10-24.
    "fastembed==0.9.1",
    "httpx2==2.16.0",
    # Signs the demo customer cookie (P2-06). 2.2.0 was published 2024-04-16.
    "itsdangerous==2.2.0",
    # Model gateway, used only in hub.llm.gateway (ADR-0003). 1.108.6 (LTS, 2026-11-12) is the
    # first 1.108 release with the fix for GHSA-2rwg-2wh4-7c4f; 1.108.3 is affected.
    # Workflow graph and its Postgres checkpointer (ADR-0002, ADR-0008), used only in hub.graph and
    # the migrations. 1.2.20: 2026-11-05; checkpoint-postgres 3.2.0: 2026-10-14. The packages they
    # pull in are held at releases at least a week old (P6-01): langgraph-checkpoint 4.3.1,
    # langgraph-prebuilt 1.1.1, langchain-core 1.7.6, langsmith 0.14.17, jsonpatch 1.44,
    # jsonpointer 3.10. No LangChain chat-model wrapper is used (design §8).
    "jsonpatch==1.48",
    "jsonpointer==3.12",
    "langchain-core==1.7.6",
    # Run traces (ADR-0014, ADR-0021), used only in hub.observability.tracing. 5.2.0: 2026-11-05;
    # it pulls in the OpenTelemetry SDK and OTLP/HTTP exporter 1.45.2 (2026-10-29).
    "langfuse==5.2.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-postgres==3.2.0",
    "langgraph-prebuilt==1.1.1",
    "langsmith==0.14.17",
    "litellm==1.108.6",
    # MCP client of the support-tools server, used only in hub.tools (ADR-0011, P7-03). The same
    # release as apps/mcp_server (2.3.0, API §7).
    "mcp==2.3.0",
    # Native code of fastembed. Held at 2.5.4 (2026-10-10) and 1.31.1 (2026-10-26): numpy 2.5.5
    # and onnxruntime 1.32.0 were under a week old at P5-01.
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    # Knowledge-base front matter (P2-08) and config/models.yaml, config/pricing.yaml (P3-01),
    # read with `yaml.safe_load` only. 6.0.3: 2025-09-25.
    "pyyaml==6.0.3",
    # Knowledge-base index (ADR-0005), used only in hub.kb. 1.20.0: 2026-10-22, the release that
    # matches the server image qdrant/qdrant:v1.20.0.
    "qdrant-client==1.20.0",
    "sqlalchemy[asyncio]==2.1.8",
    "starlette==1.10.0",
    "structlog==26.1.0",
    # uuid7 for primary keys (`uuid_utils.compat`). The 0.x line, released alongside 1.x
    # (0.19.0 and 1.2.0 both 2026-10-26): langsmith, through langchain-core and langgraph, needs
    # uuid-utils<1.0 (P6-01).
    "uuid-utils==0.19.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

# The import package stays `hub`; only the distribution name differs
# (`hub` is taken on PyPI).
[tool.uv.build-backend]
module-name = "hub"
