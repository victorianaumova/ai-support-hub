# CI from docs/operations.md §5. Dependency updates come
# from .github/dependabot.yml (P8-06). Every check runs a make target where one exists, so CI and
# a laptop run the same commands. Actions are pinned by commit SHA; the comment names the release.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.8"
  # Node LTS; pnpm comes from the `packageManager` field of apps/web/package.json.
  NODE_VERSION: "24"
  # Tests never need a provider key (AGENTS.md): the fake model mode answers instead.
  # Set empty for every job, so no step can pick a key up from the runner.
  ANTHROPIC_API_KEY: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      - name: ruff, mypy, import-linter, eslint, tsc
        run: make lint

  # The web app (P10-01): Vitest, the production build, and the generated API types are current.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      - name: Generated API types match the API
        run: |
          make web-types
          git diff --exit-code -- apps/web/src/api/schema.d.ts \
            || { echo "::error::run make web-types and commit apps/web/src/api/schema.d.ts"; exit 1; }
      - name: Vitest
        run: pnpm -C apps/web test
      - name: Production build
        run: pnpm -C apps/web build

  # Playwright against the e2e compose stack: the API serves the built app, fake models (P10-05).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      # The api container mounts the local embedding model (search runs for real, ADR-0018).
      - name: Local embedding model
        run: make models
      - name: Playwright browser
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: E2E (no provider API key)
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::a provider API key is set for the tests"
            exit 1
          fi
          make test-e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - name: make version (test_repo_tooling.py reads make's database)
        run: make --version | head -1
      # The key check runs in the same shell as the tests, so a key set at any level
      # (workflow, job or this step's env) fails here before a test can use it.
      - name: Unit tests (no provider API key)
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::a provider API key is set for the tests"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is empty"
          make test

  # Integration tests with testcontainers (Postgres, Qdrant); ubuntu-latest runners have Docker.
  # A separate job, so a slow image pull does not hold up the unit test result.
  test-int:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      # The local embedding model and BM25 files (ADR-0018); downloaded from Hugging Face and
      # checked against the pinned SHA-256. Unit tests do not need them.
      - name: Local embedding model
        run: make models
      - name: Integration tests (no provider API key)
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::a provider API key is set for the tests"
            exit 1
          fi
          make test-int
      # Nothing else builds the dev image, so a Dockerfile that no longer matches the workspace
      # (a new member, a moved pyproject) would only show up at `make dev`.
      - name: Build the api dev image
        run: docker compose -f infra/docker-compose.yml build api
      # The prod targets are what the VPS fallback and the deploy run (P10-06); build both so a
      # broken prod stage (web build, model download, copied paths) fails here, not at deploy.
      - name: Build the prod images
        run: |
          docker build -f infra/Dockerfile.api --target prod -t hub-api:ci .
          docker build -f infra/Dockerfile.mcp --target prod -t hub-mcp:ci .

  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - run: make data-check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1" # keep equal to the gitleaks rev in .pre-commit-config.yaml
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked

      # The pre-commit hook runs `gitleaks git --staged`, which scans nothing in CI, so the
      # real scan uses the release binary, checked against its published SHA-256.
      - name: gitleaks (whole git history)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: pip-audit (locked dependencies, with hashes)
        run: |
          uv export --locked --all-packages --all-groups --no-emit-workspace \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off

      # Fails the job on a high or critical advisory. pnpm 12.18.0: keep it equal to the
      # `packageManager` field of apps/web/package.json.
      - name: pnpm audit (web app)
        working-directory: apps/web
        run: npx --yes pnpm@12.18.0 audit --audit-level high

  # Informational, NOT a required check: it downloads Go from go.dev, so an outage there must not
  # block a merge. Shows that the gitleaks pre-commit hook (language: golang) installs on a
  # machine with no Go and no pre-commit cache, as on a fresh laptop.
  hook-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - name: gitleaks pre-commit hook bootstraps without Go or a cache
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-empty
        # The runner image ships Go, sometimes next to git in /usr/bin, so dropping folders from
        # PATH is not enough. The runner is thrown away after the job; renaming is safe here.
        run: |
          for _ in 1 2 3 4 5; do
            go_bin="$(command -v go)" || break
            echo "hiding $go_bin"
            sudo mv "$(readlink -f "$go_bin")" "$(readlink -f "$go_bin").hidden"
            [ -e "$go_bin" ] && sudo mv "$go_bin" "$go_bin.hidden"
            hash -r
          done
          if command -v go; then echo "::error::go is still on PATH"; exit 1; fi
          echo "go: not on PATH"
          if [ -e "$PRE_COMMIT_HOME" ]; then echo "::error::pre-commit cache exists"; exit 1; fi
          echo "pre-commit cache: none ($PRE_COMMIT_HOME)"
          uv run pre-commit run gitleaks --all-files --verbose
